plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.kosmx.dev/' }   // playerAnimator (모션)
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // 모션 라이브러리. 없어도 모드는 돌고 모션만 안 나온다 (클라이언트에 깔면 모션 재생)
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}"
    // 팔꿈치·무릎 굽힘. MIT 라이선스라 모드 안에 같이 넣는다 (따로 설치할 필요 없음). playerAnimator 2.0.4 가 5.1 API(굽힘 위치)를 써서 5.1
    include(modImplementation("io.github.kosmx.bendy-lib:bendy-lib-fabric:${project.bendy_lib_version}"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
