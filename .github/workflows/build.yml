# 코드를 올리면 GitHub가 대신 빌드해서 jar를 만들어 준다.
# 결과: 저장소 오른쪽 "Releases"의 city-latest / duel-latest 에서 jar 다운로드
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: city-ability
            tag: city-latest
            title: "도시 능력자 모드 (최신)"
          - dir: duel-mod
            tag: duel-latest
            title: "무현버스 duel 모드 (최신)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Pick jar
        id: jar
        working-directory: ${{ matrix.dir }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          echo "path=${{ matrix.dir }}/$JAR" >> "$GITHUB_OUTPUT"
          echo "built: $JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: ${{ steps.jar.outputs.path }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ${{ matrix.tag }} --yes --cleanup-tag || true
          gh release create ${{ matrix.tag }} "${{ steps.jar.outputs.path }}" \
            --title "${{ matrix.title }}" \
            --notes "커밋 ${GITHUB_SHA::7} 에서 자동으로 만든 jar. 서버와 클라이언트 mods 폴더에 넣으면 된다." \
            --target "$GITHUB_SHA" --latest=false
